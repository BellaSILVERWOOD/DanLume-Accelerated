<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DanLume</title>
    <script>
      // 首帧之前就把主题定下来，避免深浅色闪一下
      (function () {
        try {
          var mode = localStorage.getItem("danlume.mode") || "auto";
          var dark =
            mode === "dark" ||
            (mode === "auto" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.mode = dark ? "dark" : "light";
          var accent = localStorage.getItem("danlume.accent");
          if (accent) {
            document.documentElement.style.setProperty("--accent", accent);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
